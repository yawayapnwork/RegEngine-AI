    <script>
      const spec = {"openapi": "3.0.3", "info": {"title": "RegEngine AI \u2014 Regulatory Compliance & Execution API Suite", "description": "\n# RegEngine AI \u2014 Enterprise Regulatory Compliance & Execution API Suite\n\n**RegEngine AI** is a deterministic, layout-aware regulatory parsing and real-time transaction compliance evaluation platform for SEBI (Securities and Exchange Board of India) master circulars.\n\n---\n\n## \ud83c\udfdb\ufe0f Core Architectural Domains\n\n1. **Regulatory Ingestion**: Automated SEBI RSS feed polling, layout-aware PDF parsing, clause chunking, and vector indexation.\n2. **Agent Rules Engine**: Multi-agent extraction (Extraction Agent) and logic auditing (Logic Auditor Agent) compiling compliance obligations into Rego & JSON-Logic ASTs.\n3. **OPA Policy Evaluation**: Sub-millisecond synchronous transaction compliance evaluation against persistent, co-located Open Policy Agent (OPA) policy engines.\n4. **Cryptographic Audit Vault**: PostgreSQL, append-only, SHA-256 hash-chained blocks, QLDB-journal-inspired design per ADR-0003 (`compliance_audit_ledger`) backed by monotonic sequence numbers and tamper-evident block hash chains.\n5. **HITL Management**: Human-in-the-Loop review portals, live transaction flagging, and Slack / MS Teams interactive quick-approval webhooks.\n\n---\n\n## \ud83d\udd12 Authentication & Authorization\n\nRegEngine AI uses **OAuth2 with Bearer JWT tokens** (`HS256` / `RS256`).\n\n- **Broker_API_Client**: Used by stockbrokers, AMCs, and market intermediaries calling `/v1/execution/*`.\n- **Compliance_Officer**: Required for approving or rejecting compiled policies in `/v1/hitl-reviews/*`.\n- **System_Admin**: Required for infrastructure, queue depth, and DLQ management (`/v1/admin/dlq/*`).\n\n---\n\n## \u26a1 Error Handling Contract\n\nAll non-2xx responses return a standardized JSON error structure:\n\n```json\n{\n  \"detail\": \"Human-readable error explanation\",\n  \"error_code\": \"ERR_SPECIFIC_CATEGORY\",\n  \"timestamp\": \"2026-08-28T23:45:00Z\"\n}\n```\n", "version": "1.0.0"}, "paths": {"/v1/circulars/parse": {"post": {"summary": "Parse Circular", "description": "Upload a SEBI Master Circular PDF and receive layout-aware,\nclause-hashed chunks ready for indexing.", "operationId": "parse_circular_v1_circulars_parse_post", "requestBody": {"content": {"multipart/form-data": {"schema": {"$ref": "#/components/schemas/Body_parse_circular_v1_circulars_parse_post"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ParseResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/circulars/index": {"post": {"summary": "Index Circular", "description": "Embed and upsert a set of previously parsed clause chunks into Qdrant.", "operationId": "index_circular_v1_circulars_index_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexRequest"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/circulars/parse-and-index": {"post": {"summary": "Parse And Index Circular", "description": "Convenience endpoint: parse a PDF and index its chunks in one call.", "operationId": "parse_and_index_circular_v1_circulars_parse_and_index_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "recreate_collection", "in": "query", "required": false, "schema": {"type": "boolean", "default": false, "title": "Recreate Collection"}}], "requestBody": {"required": true, "content": {"multipart/form-data": {"schema": {"$ref": "#/components/schemas/Body_parse_and_index_circular_v1_circulars_parse_and_index_post"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/circulars/process-e2e": {"post": {"summary": "Process E2E Circular", "description": "Accept a regulatory PDF and execute the complete end-to-end pipeline:\nparse_pdf -> persist_circular -> persist_clauses -> extract_and_audit\n-> compile_rule -> persist_compiled_rule -> create_hitl_review", "operationId": "process_e2e_circular_v1_circulars_process_e2e_post", "requestBody": {"content": {"multipart/form-data": {"schema": {"$ref": "#/components/schemas/Body_process_e2e_circular_v1_circulars_process_e2e_post"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProcessE2EResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/circulars/{circular_id}/status": {"get": {"summary": "Get Circular Status", "description": "Retrieve the lifecycle status of an ingested circular:\nprocessing | review_required | approved | deployed | failed", "operationId": "get_circular_status_v1_circulars__circular_id__status_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "circular_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Circular Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CircularStatusResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/circulars": {"get": {"summary": "List Circulars", "description": "List ingested regulatory circulars with their live lifecycle status, using batched aggregate queries.", "operationId": "list_circulars_v1_circulars_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "limit", "in": "query", "required": false, "schema": {"anyOf": [{"type": "integer", "maximum": 500, "minimum": 1}, {"type": "null"}], "description": "Maximum number of circulars to return. If omitted, returns all circulars.", "title": "Limit"}, "description": "Maximum number of circulars to return. If omitted, returns all circulars."}, {"name": "offset", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 0, "description": "Number of circulars to skip for pagination.", "default": 0, "title": "Offset"}, "description": "Number of circulars to skip for pagination."}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"type": "object", "additionalProperties": true}, "title": "Response List Circulars V1 Circulars Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/circulars/{circular_id}/details": {"get": {"summary": "Get Circular Details", "description": "Retrieve full circular detail including parsed clauses, compiled rules, and reviews.", "operationId": "get_circular_details_v1_circulars__circular_id__details_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "circular_id", "in": "path", "required": true, "schema": {"type": "integer", "title": "Circular Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": true, "title": "Response Get Circular Details V1 Circulars  Circular Id  Details Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/healthz": {"get": {"summary": "Healthz", "operationId": "healthz_healthz_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": {"type": "string"}, "type": "object", "title": "Response Healthz Healthz Get"}}}}}}}, "/v1/execution/transactions/evaluate": {"post": {"summary": "Evaluate Transaction", "description": "Evaluate a single broker-submitted transaction against compiled Rego\npolicies via the embedded OPA engine and return allow/deny/flagged\nimmediately. FLAGGED responses carry a `hitl_case_id`; the final\ndecision is delivered later to `transaction.callback_url`, if set, once\na human resolves it (see POST /hitl/cases/{case_id}/resolve).\n\nEvery evaluation is also recorded in the tamper-evident audit ledger\n(app.ledger) before the response is returned. A ledger write failure\nis logged but never turns a completed compliance decision into a\n5xx \u2014 see the trade-off note in app.ledger.integration.log_evaluation.", "operationId": "evaluate_transaction_v1_execution_transactions_evaluate_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionPayload"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EvaluationResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/execution/batches": {"post": {"summary": "Submit Batch", "description": "Enqueue a batch parsed from a legacy SFTP landing-zone file (or any\ncaller with an in-memory batch) for asynchronous processing on the\n`regengine_batch` Celery/Redis queue. Returns immediately with the\nbatch_id; poll GET /batches/{batch_id} or supply result_webhook_url.", "operationId": "submit_batch_v1_execution_batches_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/BatchIngestRequest"}}}, "required": true}, "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": {"type": "string"}, "type": "object", "title": "Response Submit Batch V1 Execution Batches Post"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/execution/batches/{batch_id}": {"get": {"summary": "Get Batch Status", "operationId": "get_batch_status_v1_execution_batches__batch_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "batch_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Batch Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BatchJobResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/cdc/events": {"post": {"summary": "Receive Cdc Event", "description": "Receiver for a Debezium/Kafka-Connect HTTP sink (or a direct DB\ntrigger) capturing INSERT/UPDATE on the legacy `transactions` table.\nEnqueues evaluation on the `regengine_cdc` queue and returns\nimmediately so the DB trigger/connector is never blocked on policy\nevaluation latency.", "operationId": "receive_cdc_event_v1_execution_cdc_events_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "oms_webhook_url", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Oms Webhook Url"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CDCEvent"}}}}, "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": {"type": "string"}, "title": "Response Receive Cdc Event V1 Execution Cdc Events Post"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/hitl/cases": {"get": {"summary": "List Hitl Cases", "operationId": "list_hitl_cases_v1_execution_hitl_cases_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/HITLCase"}, "type": "array", "title": "Response List Hitl Cases V1 Execution Hitl Cases Get"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/execution/hitl/cases/{case_id}": {"get": {"summary": "Get Hitl Case", "operationId": "get_hitl_case_v1_execution_hitl_cases__case_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "case_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Case Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLCase"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/hitl/cases/{case_id}/resolve": {"post": {"summary": "Resolve Hitl Case", "description": "A compliance reviewer resolves an ambiguous transaction as ALLOW or\nDENY. If the original transaction carried a `callback_url`, the final\ndecision is dispatched there asynchronously (with retry) via the\n`regengine_webhooks` queue, closing the fallback loop from requirement 3.", "operationId": "resolve_hitl_case_v1_execution_hitl_cases__case_id__resolve_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "case_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Case Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLResolutionRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLCase"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/ledger/entries": {"get": {"summary": "List Ledger Entries", "description": "Retrieve the most recent hash-chained ledger rows for audit inspection.", "operationId": "list_ledger_entries_v1_execution_ledger_entries_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "default": 50, "title": "Limit"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"type": "object", "additionalProperties": true}, "title": "Response List Ledger Entries V1 Execution Ledger Entries Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/ledger/verify": {"get": {"summary": "Verify Ledger Chain", "description": "Cryptographically verify the integrity of the audit ledger's SHA-256 hash chain.", "operationId": "verify_ledger_chain_v1_execution_ledger_verify_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": true, "type": "object", "title": "Response Verify Ledger Chain V1 Execution Ledger Verify Get"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/hitl-reviews": {"get": {"tags": ["hitl-review-portal"], "summary": "List Reviews", "operationId": "list_reviews_v1_hitl_reviews_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "status_filter", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Status Filter"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/HITLReviewOut"}, "title": "Response List Reviews V1 Hitl Reviews Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/hitl-reviews/{review_id}": {"get": {"tags": ["hitl-review-portal"], "summary": "Get Review", "operationId": "get_review_v1_hitl_reviews__review_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "review_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Review Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLReviewOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/hitl-reviews/{review_id}/approve": {"post": {"tags": ["hitl-review-portal"], "summary": "Approve Review", "description": "Approves a HITL review.\n\nGating Logic:\nA CompiledRule is ONLY activated (is_active=True, hitl_status='RESOLVED')\nif EVERY required blocking review for that rule has been resolved and approved,\nand no review is rejected or revision-required. If other blocking reviews remain,\nthe review itself is marked RESOLVED, but the CompiledRule remains inactive\nand un-published until all reviews have cleared the gate.\n\nRequires step-up MFA (app.security.step_up.require_step_up_mfa).", "operationId": "approve_review_v1_hitl_reviews__review_id__approve_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "review_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Review Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReviewResolutionRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLReviewOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/hitl-reviews/{review_id}/reject": {"post": {"tags": ["hitl-review-portal"], "summary": "Reject Review", "description": "Rejects the compiled policy review: it is never activated. The clause\nstays flagged for re-extraction/manual authoring.", "operationId": "reject_review_v1_hitl_reviews__review_id__reject_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "review_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Review Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReviewResolutionRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLReviewOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/hitl-reviews/{review_id}/request-revision": {"post": {"tags": ["hitl-review-portal"], "summary": "Request Revision Review", "description": "Flags the review as requiring revision: the policy is not activated\nand routes back for re-extraction.", "operationId": "request_revision_review_v1_hitl_reviews__review_id__request_revision_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "review_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Review Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReviewResolutionRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLReviewOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/auth/token": {"post": {"tags": ["auth"], "summary": "Issue Token", "description": "RFC 6749 \u00a74.4 client_credentials grant. A broker's system\nauthenticates as its registered `client_id`/`client_secret` (issued\nout-of-band during onboarding -- see app.security.tenant_store's\nmodule docstring: there is deliberately no public self-service\nsignup) and receives a short-lived Broker_API_Client access token\nscoped to its own tenant_id.", "operationId": "issue_token_v1_auth_token_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClientCredentialsRequest"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TokenResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/auth/signup": {"post": {"tags": ["auth"], "summary": "Signup", "description": "Self-service account creation for the custom login page's sign-up\nflow: hashes the password (bcrypt, via LocalUserStore) and persists a\nnew `User` row. Always provisions Compliance_Officer -- the least-\nprivileged human role; a System_Admin account is never handed out\nthrough public signup, only via POST /v1/auth/users.", "operationId": "signup_v1_auth_signup_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginRequest"}}}, "required": true}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SignupResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/auth/login": {"post": {"tags": ["auth"], "summary": "Login", "description": "Standalone email/password login for the custom login page: verifies\ncredentials against this service's own local account store (never an\nexternal IdP) and mints a self-issued access token, the same\ncreate_access_token path app.api.saml_routes bridges a SAML assertion\nthrough -- so RBAC/session handling downstream never needs to know\nwhich login path a given token came from.", "operationId": "login_v1_auth_login_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginRequest"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TokenResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/auth/users": {"post": {"tags": ["auth"], "summary": "Create Local User", "description": "Provisions a local Compliance_Officer account on an administrator's\nbehalf -- the System_Admin-only counterpart to public signup, for\nprovisioning an account for someone else (or, unlike POST\n/v1/auth/signup, promoting to System_Admin is only ever done by editing\na `User` row directly -- there is deliberately no API surface that lets\neven a System_Admin self-elevate a new account straight to\nSystem_Admin over a network call).", "operationId": "create_local_user_v1_auth_users_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginRequest"}}}, "required": true}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": true, "type": "object", "title": "Response Create Local User V1 Auth Users Post"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/auth/me": {"get": {"tags": ["auth"], "summary": "Introspect Self", "description": "Returns the caller's own resolved identity -- useful for the HITL\nreview portal frontend to confirm \"am I logged in as a\nCompliance_Officer\" without decoding the JWT client-side, and for\ndebugging a broker integration's token.", "operationId": "introspect_self_v1_auth_me_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Principal"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/ingestion/poll": {"post": {"tags": ["ingestion"], "summary": "Trigger Poll", "description": "Enqueues one ingestion poll cycle immediately instead of waiting for\nthe next `ingestion_poll_interval_seconds` beat tick.", "operationId": "trigger_poll_v1_ingestion_poll_post", "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TriggerResponse"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/ingestion/poll/{task_id}": {"get": {"tags": ["ingestion"], "summary": "Poll Status", "operationId": "poll_status_v1_ingestion_poll__task_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/ingestion/uploads": {"post": {"tags": ["ingestion"], "summary": "Upload Circular Pdf", "description": "Accept a user-uploaded SEBI Master Circular PDF, write it to object\nstorage, and enqueue a Celery task\n`process_manual_upload_task` to parse + index it, instead of doing that\nwork inside this HTTP request.",
