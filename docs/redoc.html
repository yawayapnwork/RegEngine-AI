    <script>
      const spec = {"openapi": "3.0.3", "info": {"title": "RegEngine AI \u2014 Regulatory Compliance & Execution API Suite", "description": "\n# RegEngine AI \u2014 Enterprise Regulatory Compliance & Execution API Suite\n\n**RegEngine AI** is a deterministic, layout-aware regulatory parsing and real-time transaction compliance evaluation platform for SEBI (Securities and Exchange Board of India) master circulars.\n\n---\n\n## \ud83c\udfdb\ufe0f Core Architectural Domains\n\n1. **Regulatory Ingestion**: Automated SEBI RSS feed polling, layout-aware PDF parsing, clause chunking, and vector indexation.\n2. **Agent Rules Engine**: Multi-agent extraction (Extraction Agent) and logic auditing (Logic Auditor Agent) compiling compliance obligations into Rego & JSON-Logic ASTs.\n3. **OPA Policy Evaluation**: Sub-millisecond synchronous transaction compliance evaluation against persistent, co-located Open Policy Agent (OPA) policy engines.\n4. **Cryptographic Audit Vault**: Append-only, tamper-evident audit ledger (`compliance_audit_ledger`) backed by monotonic sequence numbers and SHA-256 block hash chains.\n5. **HITL Management**: Human-in-the-Loop review portals, live transaction flagging, and Slack / MS Teams interactive quick-approval webhooks.\n\n---\n\n## \ud83d\udd12 Authentication & Authorization\n\nRegEngine AI uses **OAuth2 with Bearer JWT tokens** (`HS256` / `RS256`).\n\n- **Broker_API_Client**: Used by stockbrokers, AMCs, and market intermediaries calling `/v1/execution/*`.\n- **Compliance_Officer**: Required for approving or rejecting compiled policies in `/v1/hitl-reviews/*`.\n- **System_Admin**: Required for infrastructure, queue depth, and DLQ management (`/v1/admin/dlq/*`).\n\n---\n\n## \u26a1 Error Handling Contract\n\nAll non-2xx responses return a standardized JSON error structure:\n\n```json\n{\n  \"detail\": \"Human-readable error explanation\",\n  \"error_code\": \"ERR_SPECIFIC_CATEGORY\",\n  \"timestamp\": \"2026-08-28T23:45:00Z\"\n}\n```\n", "version": "1.0.0"}, "paths": {"/v1/circulars/parse": {"post": {"summary": "Parse Circular", "description": "Upload a SEBI Master Circular PDF and receive layout-aware,\nclause-hashed chunks ready for indexing.", "operationId": "parse_circular_v1_circulars_parse_post", "requestBody": {"content": {"multipart/form-data": {"schema": {"$ref": "#/components/schemas/Body_parse_circular_v1_circulars_parse_post"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ParseResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/circulars/index": {"post": {"summary": "Index Circular", "description": "Embed and upsert a set of previously parsed clause chunks into Qdrant.", "operationId": "index_circular_v1_circulars_index_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexRequest"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/circulars/parse-and-index": {"post": {"summary": "Parse And Index Circular", "description": "Convenience endpoint: parse a PDF and index its chunks in one call.", "operationId": "parse_and_index_circular_v1_circulars_parse_and_index_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "recreate_collection", "in": "query", "required": false, "schema": {"type": "boolean", "default": false, "title": "Recreate Collection"}}], "requestBody": {"required": true, "content": {"multipart/form-data": {"schema": {"$ref": "#/components/schemas/Body_parse_and_index_circular_v1_circulars_parse_and_index_post"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/healthz": {"get": {"summary": "Healthz", "operationId": "healthz_healthz_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": {"type": "string"}, "type": "object", "title": "Response Healthz Healthz Get"}}}}}}}, "/v1/execution/transactions/evaluate": {"post": {"summary": "Evaluate Transaction", "description": "Evaluate a single broker-submitted transaction against compiled Rego\npolicies via the embedded OPA engine and return allow/deny/flagged\nimmediately. FLAGGED responses carry a `hitl_case_id`; the final\ndecision is delivered later to `transaction.callback_url`, if set, once\na human resolves it (see POST /hitl/cases/{case_id}/resolve).\n\nEvery evaluation is also recorded in the tamper-evident audit ledger\n(app.ledger) before the response is returned. A ledger write failure\nis logged but never turns a completed compliance decision into a\n5xx \u2014 see the trade-off note in app.ledger.integration.log_evaluation.", "operationId": "evaluate_transaction_v1_execution_transactions_evaluate_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionPayload"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/EvaluationResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/execution/batches": {"post": {"summary": "Submit Batch", "description": "Enqueue a batch parsed from a legacy SFTP landing-zone file (or any\ncaller with an in-memory batch) for asynchronous processing on the\n`regengine_batch` Celery/Redis queue. Returns immediately with the\nbatch_id; poll GET /batches/{batch_id} or supply result_webhook_url.", "operationId": "submit_batch_v1_execution_batches_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/BatchIngestRequest"}}}, "required": true}, "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": {"type": "string"}, "type": "object", "title": "Response Submit Batch V1 Execution Batches Post"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/execution/batches/{batch_id}": {"get": {"summary": "Get Batch Status", "operationId": "get_batch_status_v1_execution_batches__batch_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "batch_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Batch Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BatchJobResult"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/cdc/events": {"post": {"summary": "Receive Cdc Event", "description": "Receiver for a Debezium/Kafka-Connect HTTP sink (or a direct DB\ntrigger) capturing INSERT/UPDATE on the legacy `transactions` table.\nEnqueues evaluation on the `regengine_cdc` queue and returns\nimmediately so the DB trigger/connector is never blocked on policy\nevaluation latency.", "operationId": "receive_cdc_event_v1_execution_cdc_events_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "oms_webhook_url", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Oms Webhook Url"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CDCEvent"}}}}, "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": {"type": "string"}, "title": "Response Receive Cdc Event V1 Execution Cdc Events Post"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/hitl/cases": {"get": {"summary": "List Hitl Cases", "operationId": "list_hitl_cases_v1_execution_hitl_cases_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/HITLCase"}, "type": "array", "title": "Response List Hitl Cases V1 Execution Hitl Cases Get"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/execution/hitl/cases/{case_id}": {"get": {"summary": "Get Hitl Case", "operationId": "get_hitl_case_v1_execution_hitl_cases__case_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "case_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Case Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLCase"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/execution/hitl/cases/{case_id}/resolve": {"post": {"summary": "Resolve Hitl Case", "description": "A compliance reviewer resolves an ambiguous transaction as ALLOW or\nDENY. If the original transaction carried a `callback_url`, the final\ndecision is dispatched there asynchronously (with retry) via the\n`regengine_webhooks` queue, closing the fallback loop from requirement 3.", "operationId": "resolve_hitl_case_v1_execution_hitl_cases__case_id__resolve_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "case_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Case Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLResolutionRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLCase"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/ingestion/poll": {"post": {"tags": ["ingestion"], "summary": "Trigger Poll", "description": "Enqueues one ingestion poll cycle immediately instead of waiting for\nthe next `ingestion_poll_interval_seconds` beat tick.", "operationId": "trigger_poll_v1_ingestion_poll_post", "responses": {"202": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TriggerResponse"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/ingestion/poll/{task_id}": {"get": {"tags": ["ingestion"], "summary": "Poll Status", "operationId": "poll_status_v1_ingestion_poll__task_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "task_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Task Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/auth/token": {"post": {"tags": ["auth"], "summary": "Issue Token", "description": "RFC 6749 \u00a74.4 client_credentials grant. A broker's system\nauthenticates as its registered `client_id`/`client_secret` (issued\nout-of-band during onboarding -- see app.security.tenant_store's\nmodule docstring: there is deliberately no public self-service\nsignup) and receives a short-lived Broker_API_Client access token\nscoped to its own tenant_id.", "operationId": "issue_token_v1_auth_token_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClientCredentialsRequest"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TokenResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/auth/me": {"get": {"tags": ["auth"], "summary": "Introspect Self", "description": "Returns the caller's own resolved identity -- useful for the HITL\nreview portal frontend to confirm \"am I logged in as a\nCompliance_Officer\" without decoding the JWT client-side, and for\ndebugging a broker integration's token.", "operationId": "introspect_self_v1_auth_me_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Principal"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/hitl-reviews": {"get": {"tags": ["hitl-review-portal"], "summary": "List Reviews", "operationId": "list_reviews_v1_hitl_reviews_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "status_filter", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Status Filter"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/HITLReviewOut"}, "title": "Response List Reviews V1 Hitl Reviews Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/hitl-reviews/{review_id}": {"get": {"tags": ["hitl-review-portal"], "summary": "Get Review", "operationId": "get_review_v1_hitl_reviews__review_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "review_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Review Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLReviewOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/hitl-reviews/{review_id}/approve": {"post": {"tags": ["hitl-review-portal"], "summary": "Approve Review", "description": "Approves the compiled policy this review concerns: activates its\nCompiledRule version (deactivating any prior active version of the\nsame rule_id, so exactly one version is ever live -- see\napp.db.models.CompiledRule's partial-unique-index comment), marks the\nreview RESOLVED under this officer's identity, and publishes a\nPolicyEvent so every FastAPI worker's PolicyHotReloadSubscriber\nhot-reloads OPA within its next pub/sub poll -- typically low\nmilliseconds, never a restart. Publishing happens AFTER the DB commit\n(not inside the same transaction): a Redis PUBLISH cannot be rolled\nback, so it must only ever fire once the approval it describes is\ndurably true, not before.", "operationId": "approve_review_v1_hitl_reviews__review_id__approve_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "review_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Review Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReviewResolutionRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLReviewOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/hitl-reviews/{review_id}/reject": {"post": {"tags": ["hitl-review-portal"], "summary": "Reject Review", "description": "Rejects the compiled policy: it is never activated. The clause\nstays flagged for re-extraction/manual authoring; this does not delete\nthe CompiledRule row (kept for audit trail of what was proposed and\nwhy it was refused).", "operationId": "reject_review_v1_hitl_reviews__review_id__reject_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "review_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Review Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReviewResolutionRequest"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HITLReviewOut"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/admin/dlq": {"get": {"tags": ["dlq-admin"], "summary": "List Dlq Entries", "operationId": "list_dlq_entries_v1_admin_dlq_get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "category", "in": "query", "required": false, "schema": {"anyOf": [{"$ref": "#/components/schemas/FailureCategory"}, {"type": "null"}], "title": "Category"}}, {"name": "status_filter", "in": "query", "required": false, "schema": {"anyOf": [{"$ref": "#/components/schemas/DLQStatus"}, {"type": "null"}], "title": "Status Filter"}}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "default": 50, "title": "Limit"}}, {"name": "offset", "in": "query", "required": false, "schema": {"type": "integer", "default": 0, "title": "Offset"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/DLQEntry"}, "title": "Response List Dlq Entries V1 Admin Dlq Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/admin/dlq/stats": {"get": {"tags": ["dlq-admin"], "summary": "Dlq Stats", "operationId": "dlq_stats_v1_admin_dlq_stats_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DLQStats"}}}}}, "security": [{"HTTPBearer": []}]}}, "/v1/admin/dlq/{entry_id}": {"get": {"tags": ["dlq-admin"], "summary": "Get Dlq Entry", "operationId": "get_dlq_entry_v1_admin_dlq__entry_id__get", "security": [{"HTTPBearer": []}], "parameters": [{"name": "entry_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Entry Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DLQEntry"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "patch": {"tags": ["dlq-admin"], "summary": "Edit Dlq Entry Payload", "description": "A compliance engineer corrects the failing parameters -- e.g. a\nmalformed source URL, an override flag that should have been set --\nbefore requeueing. See app.resilience.models.DLQEntryUpdate's\ndocstring for why this replaces the whole payload rather than merging\na partial one.", "operationId": "edit_dlq_entry_payload_v1_admin_dlq__entry_id__patch", "security": [{"HTTPBearer": []}], "parameters": [{"name": "entry_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Entry Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DLQEntryUpdate"}}}}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DLQEntry"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/admin/dlq/{entry_id}/requeue": {"post": {"tags": ["dlq-admin"], "summary": "Requeue Dlq Entry", "description": "Re-dispatches `entry.task_name` (whatever it currently is -- edit\nit first via PATCH if the failing parameters need correcting) with\n`entry.payload` as keyword arguments, via `celery_app.send_task` --\ndispatch by name, not by importing the task function, so this one\nendpoint can requeue any DLQ-routed task type without a per-category\nif/elif chain to keep in sync as new task modules are added (see\napp.compiler.tasks / app.agents.tasks / app.vectorstore.tasks /\napp.ingestion.tasks -- every one of them structures its DLQ payload as\na kwargs-shaped dict for exactly this reason).", "operationId": "requeue_dlq_entry_v1_admin_dlq__entry_id__requeue_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "entry_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Entry Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DLQRequeueResponse"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/v1/admin/dlq/{entry_id}/discard": {"post": {"tags": ["dlq-admin"], "summary": "Discard Dlq Entry", "description": "Marks an entry DISCARDED without reprocessing it -- e.g. a\nduplicate, a spam/junk PDF the RSS feed picked up, a test document.\nDistinct from `/resolve`: discard means \"not worth fixing\", resolve\nmeans \"confirmed fixed\".", "operationId": "discard_dlq_entry_v1_admin_dlq__entry_id__discard_post", "security": [{"HTTPBearer": []}], "parameters": [{"name": "entry_id", "in": "path", "required": true, "schema": {"type": "string", "title": "Entry Id"}}], "requestBody": {"required": true, "content": {"application/json": {"sc
