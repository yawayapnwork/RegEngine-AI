# =============================================================================
# Docker Compose: Apache Flink + PyFlink High-Frequency Event-Stream Engine
# =============================================================================
# Architecture:
#   1. Flink JobManager (Cluster Manager & Job Coordinator)
#   2. Flink TaskManager (Parallel Stream Execution Workers)
#   3. Apache Kafka (Message Backbone: regengine.trades.raw & regengine.trades.evaluated)
#   4. OPA Policy Engine Sidecar (Persistent Policy Evaluation Server)
# =============================================================================

version: '3.8'

services:
  flink-jobmanager:
    image: apache/flink:1.19.0-scala_2.12-java17
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.backend.incremental: true
        execution.checkpointing.interval: 5000ms
        execution.checkpointing.mode: EXACTLY_ONCE
    networks:
      - flink-net

  flink-taskmanager:
    image: apache/flink:1.19.0-scala_2.12-java17
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 2
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
    networks:
      - flink-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flink-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - flink-net

  opa:
    image: openpolicyagent/opa:0.68.0-static
    container_name: flink-opa-sidecar
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info"]
    ports:
      - "8181:8181"
    networks:
      - flink-net

networks:
  flink-net:
    driver: bridge
