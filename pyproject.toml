[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regengine-ai"
version = "0.1.0"
description = "Dual-agent regulatory compliance analysis, rule compilation, and tamper-evident audit ledger"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RegEngine AI Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "email-validator>=2.0",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
    "unstructured[pdf]>=0.15",
    "tika>=2.6.0",
    "pdf2image>=1.17",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.10",
    "crewai>=0.70",
    "crewai-tools>=0.12",
    "langgraph>=0.2.0",
    "neo4j>=5.24",
    "litellm>=1.44",
    "httpx>=0.27",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.1",
    "click>=8.1",
    "rich>=13.7",
    "typer>=0.12",
    "pandas>=2.2",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "pypdf>=4.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "prometheus-client>=0.20",
    "py_ecc>=8.0",
    "guardrails-ai>=0.10.2",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "transformers>=4.40",
    "langdetect>=1.0.9",
    "paramiko>=3.4",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "types-redis",
    "types-python-dateutil",
    "types-beautifulsoup4",
]
sso = [
    "python3-saml>=1.16.0",
]
aws = [
    "boto3>=1.34",
]
vault = [
    "hvac>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "unit: fast isolated unit tests",
    "integration: service and integration tests",
    "e2e: end-to-end workflow tests",
    "slow: tests requiring heavy model downloads or slow fixtures",
]