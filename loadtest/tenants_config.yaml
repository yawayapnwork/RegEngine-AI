# Multi-tenant broker configuration for the load test. `weight` is the
# relative share of simulated traffic this tenant should receive --
# modeled after a realistic market-intermediary mix (a handful of large
# full-service brokers generating most order flow, a long tail of smaller
# discount brokers each generating little) rather than uniform load across
# tenants, since a real spike in production is never evenly distributed.
#
# client_secret values here are load-test fixtures only -- never reuse
# these against a real environment. `provision_tenants.py` registers them
# into the target environment's TenantClientStore (Redis) before a run.

tenants:
  - tenant_id: "INZ0001001"
    client_id: "loadtest-inz0001001"
    client_secret: "loadtest-secret-inz0001001-CHANGE-ME"
    display_name: "Large Full-Service Broker A"
    weight: 25

