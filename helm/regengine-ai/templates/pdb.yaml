{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "regengine-ai.fullname" . }}-api
  labels:
    {{- include "regengine-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "regengine-ai.roleSelectorLabels" (dict "role" "api" "context" $) | nindent 6 }}
{{- end }}
---
{{- if and .Values.worker.enabled .Values.worker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "regengine-ai.fullname" . }}-worker
  labels:
    {{- include "regengine-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "regengine-ai.roleSelectorLabels" (dict "role" "worker" "context" $) | nindent 6 }}
{{- end }}
