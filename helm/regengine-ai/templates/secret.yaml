{{/*
Dev/demo convenience only -- see values.yaml's `secrets` block. Production
should set secrets.create=false and point secrets.existingSecretName at a
Secret managed out-of-band (sealed-secrets / External Secrets Operator /
Vault), so real credentials never pass through `helm install -f values.yaml`
or land in Helm's release-history ConfigMaps/Secrets in plaintext.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "regengine-ai.fullname" . }}
  labels:
    {{- include "regengine-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
