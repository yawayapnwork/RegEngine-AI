# ClusterIP Service for the api Deployment only. Celery worker/beat Pods
# receive no inbound traffic (they pull from Redis queues) and get no
# Service; OPA is a same-Pod sidecar reached over loopback, never through a
# Service either -- see deployment.yaml's comments.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "regengine-ai.fullname" . }}-api
  labels:
    {{- include "regengine-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "regengine-ai.roleSelectorLabels" (dict "role" "api" "context" $) | nindent 4 }}
