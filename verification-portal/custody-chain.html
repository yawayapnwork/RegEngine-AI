  .tn-status.warn { color: var(--warn-strong); }

  .kv-note { grid-column: 1 / -1; color: var(--ink-faint); font-family: var(--font-display); font-size: 11.5px; margin-top: 4px; }

  .empty-tree { padding: 34px 18px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  /* ---------- Manifest / clause tables ---------- */
  .flat-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .flat-table th { text-align: left; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .flat-table td { padding: 9px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); vertical-align: top; }
  .flat-table tr:last-child td { border-bottom: none; }
  .flat-table .path { word-break: break-all; }
  .table-scroll { overflow-x: auto; }

  const rsaPubKeySeq = derReadTLV(spkiDer, rsaPubKeySeqStart); // inner SEQUENCE
  const modulusInt = derReadTLV(spkiDer, rsaPubKeySeq.valueStart); // INTEGER modulus
  let modLen = modulusInt.length;
  // A DER INTEGER prefixes a 0x00 sign-padding byte when the high bit of
  // the first real byte would otherwise be mistaken for a negative sign --
  // that byte is not part of the key's actual byte length.
  if (bytes_at(spkiDer, modulusInt.valueStart) === 0x00) modLen -= 1;
  return modLen;
}
function bytes_at(bytes, i) { return bytes[i]; }

/* =========================================================================
   WebAssembly SHA-256 -- see the "Why WebAssembly, not a JS one-liner"
   methodology note in the rendered page. Compiled from a hand-written
   FIPS 180-4 implementation (source available on request from RegEngine
   AI engineering); verified byte-for-byte against Python's hashlib.sha256
   across boundary-length inputs (0, 55, 56, 57, 63, 64, 65 bytes and a
   1MB random payload) before being embedded here.
   ========================================================================= */
class WasmSha256 {
  static async create(base64Module) {
    const bytes = base64ToBytes(base64Module);
    const { instance } = await WebAssembly.instantiate(bytes, {});
    return new WasmSha256(instance);
  }
  constructor(instance) {
    this.instance = instance;
    this.exports = instance.exports;
    this.memory = this.exports.memory;
    this.INPUT_PTR = this.exports.INPUT_PTR.value;
    this.OUT_PTR = this.exports.OUT_PTR.value;
  }
  _ensureCapacity(len) {
    const needed = this.INPUT_PTR + len + 9 + 63; // input + 0x80 + up to 63 zero pad bytes + 8-byte length
    const have = this.memory.buffer.byteLength;
    if (needed > have) {
      const pages = Math.ceil((needed - have) / 65536);
      this.memory.grow(pages);
    }
  }
  hash(bytes) {
    this._ensureCapacity(bytes.length);
    const mem = new Uint8Array(this.memory.buffer);
    mem.set(bytes, this.INPUT_PTR);
    const paddedLen = this.exports.pad(bytes.length);
    this.exports.hash(paddedLen);
    return new Uint8Array(this.memory.buffer, this.OUT_PTR, 32).slice();
  }
  hex(bytes) { return bytesToHex(this.hash(bytes)); }
  hexOfUtf8(str) { return this.hex(new TextEncoder().encode(str)); }
}

/* =========================================================================
   Ledger hash-chain re-derivation -- a direct JS port of
   app.ledger.hash_chain.compute_block_hash, the exact function RegEngine's
   signer uses server-side (see the methodology section for the source
   reference). GENESIS_HASH matches app.ledger.hash_chain.GENESIS_HASH.
   ========================================================================= */
const GENESIS_HASH = "0".repeat(64);

function computeBlockHash(sha256, previousHash, payloadDigest, sequenceNum, evaluatedAt) {
  const material = `${previousHash}|${payloadDigest}|${sequenceNum}|${evaluatedAt}`;
  return sha256.hexOfUtf8(material);
}

function verifyLedgerChain(sha256, rawEntries) {
  const entries = [...rawEntries].sort((a, b) => a.sequence_num - b.sequence_num);
  const nodes = [];
  let previousHash = null;

  entries.forEach((entry, i) => {
    const seq = entry.sequence_num;
    const evaluatedAt = entry.evaluated_at;
    const payloadDigest = entry.payload_digest;
    const statedHash = entry.current_hash;

    let gap = false;
    if (i === 0) {
      previousHash = seq === 0 ? GENESIS_HASH : null; // null = "anchor unknown from this export alone"
    } else {
      const prevSeq = entries[i - 1].sequence_num;
      if (seq !== prevSeq + 1) gap = true;
    }

    let recomputedHash = null;
    let hashMatches = null;
    if (previousHash !== null) {
      recomputedHash = computeBlockHash(sha256, previousHash, payloadDigest, seq, evaluatedAt);
      hashMatches = recomputedHash === statedHash;
    }

    let status;
    if (gap) status = "warn";
    else if (previousHash === null) status = "warn"; // can't anchor -- predecessor row missing from this export
    else if (!hashMatches) status = "fail";
    else status = "pass";

    nodes.push({
      ...entry,
      gap,
      previousHashUsed: previousHash,
      recomputedHash,
      hashMatches,
      status,
    });

    previousHash = statedHash;
  });

  return nodes;
}

/* =========================================================================
   RSA-PSS signature verification via Web Crypto -- reproduces
   app.reporting.signing's exact scheme: RSASSA-PSS, MGF1(SHA-256),
   hash=SHA-256, salt length = PSS.MAX_LENGTH (modulusBytes - hLen - 2).
   ========================================================================= */
async function verifyManifestSignature(manifestBytes, signatureJson) {
  if (signatureJson.algorithm !== "RSA-PSS-SHA256") {
    return { ok: false, reason: `Unrecognized signature algorithm "${signatureJson.algorithm}" -- expected RSA-PSS-SHA256.` };
  }
  let spkiDer;
  try {
    spkiDer = pemToDer(signatureJson.public_key_pem);
  } catch (e) {
    return { ok: false, reason: "Could not parse the embedded public key PEM." };
  }
  let saltLength;
  try {
    const modLen = rsaModulusByteLengthFromSpki(spkiDer);
    saltLength = modLen - 32 - 2; // PSS.MAX_LENGTH for a SHA-256 digest
  } catch (e) {
    return { ok: false, reason: "Could not determine the RSA key size from the embedded public key." };
  }
  let cryptoKey;
  try {
    cryptoKey = await crypto.subtle.importKey("spki", spkiDer, { name: "RSA-PSS", hash: "SHA-256" }, false, ["verify"]);
  } catch (e) {
    return { ok: false, reason: "The embedded public key could not be imported by the browser's WebCrypto engine." };
  }
  const signatureBytes = base64ToBytes(signatureJson.signature_b64);
  try {
    const valid = await crypto.subtle.verify({ name: "RSA-PSS", saltLength }, cryptoKey, signatureBytes, manifestBytes);
    return { ok: valid, reason: valid ? null : "The signature does not match manifest.json's current bytes.", saltLength };
  } catch (e) {
    return { ok: false, reason: "WebCrypto rejected the signature verification: " + e.message };
  }
}

/* =========================================================================
   Package loading: accepts a .zip (full audit binder) or a bare .json
   (audit_binder.json / ledger_proof.json alone -- chain-only verification).
   ========================================================================= */
async function loadPackage(file, sha256) {
  const lower = file.name.toLowerCase();
  if (lower.endsWith(".zip")) return loadZipPackage(file, sha256);
  if (lower.endsWith(".json")) return loadJsonPackage(file);
  throw new Error("Unrecognized file type -- expected a .zip audit binder or a .json ledger export.");
}

async function loadJsonPackage(file) {
  const text = await file.text();
  const data = JSON.parse(text);
  const entries = data.ledger_entries || data.entries || null;
  if (!entries) throw new Error('No "ledger_entries" or "entries" array found in this JSON file.');
  return { kind: "json", fileName: file.name, ledgerEntries: entries, manifest: null, signature: null, manifestFiles: null, clauseHashes: null };
}

async function loadZipPackage(file, sha256) {
  const zip = await JSZip.loadAsync(file);
  const manifestEntry = zip.file("manifest.json");
  if (!manifestEntry) throw new Error('This ZIP has no "manifest.json" at its root -- not a recognized RegEngine audit binder.');

  const manifestBytes = await manifestEntry.async("uint8array");
  const manifest = JSON.parse(new TextDecoder().decode(manifestBytes));

  const fileResults = [];
  for (const entry of manifest.files || []) {
    const zObj = zip.file(entry.path);
    if (!zObj) {
      fileResults.push({ path: entry.path, expected: entry.sha256, actual: null, status: "fail", note: "File listed in the manifest is missing from the package." });
      continue;
    }
    const content = await zObj.async("uint8array");
    const actual = sha256.hex(content);
    fileResults.push({ path: entry.path, expected: entry.sha256, actual, status: actual === entry.sha256 ? "pass" : "fail" });
  }

  let signature = null;
  const sigEntry = zip.file("digital_signature.json");
  if (sigEntry) {
    signature = JSON.parse(await sigEntry.async("string"));
  }

  let ledgerEntries = null;
  for (const candidate of ["ledger_proof.json", "audit_binder.json"]) {
    const f = zip.file(candidate);
    if (!f) continue;
    const parsed = JSON.parse(await f.async("string"));
    ledgerEntries = parsed.ledger_entries || parsed.entries || null;
    if (ledgerEntries) break;
  }

  let clauseHashes = null;
  const clauseFile = zip.file("source_circulars/clause_hashes.json");
  if (clauseFile) clauseHashes = JSON.parse(await clauseFile.async("string"));

  return { kind: "zip", fileName: file.name, manifest, manifestBytes, manifestFiles: fileResults, signature, ledgerEntries, clauseHashes };
}

/* =========================================================================

function Pill({ status, children }) {

}
const STATUS_LABEL = { pass: "Verified", fail: "Failed", warn: "Attention", skip: "Not present" };

function TierCard({ name, status, children }) {

/* =========================================================================
   Proof tree node
   ========================================================================= */
function ProofNode({ node, expanded, onToggle }) {
  const statusLabel = node.status === "pass" ? "Linked" : node.status === "fail" ? "Broken link" : "Gap";
  return h(React.Fragment, null,
    h("div", { className: `tree-node ${expanded ? "expanded" : ""}`, onClick: onToggle, role: "button", tabIndex: 0, "aria-expanded": expanded },
      h("span", { className: `link-stripe ${node.status}` }),
      h("span", { className: "tn-seq" }, "#" + node.sequence_num),
      h("span", { className: "tn-body" },
        h("span", { className: "tn-txn" }, node.transaction_id || "—"),
        h("span", { className: "tn-rule" }, node.rule_id || "")
      ),
      h("span", { className: `tn-status ${node.status}` }, statusLabel)
    ),
    expanded && h("div", { className: "tn-expand" },
      h("dl", { className: "kv" },
        h("dt", null, "Broker"), h("dd", null, node.broker_id || "—"),
        h("dt", null, "Evaluated at"), h("dd", null, node.evaluated_at || "—"),
        h("dt", null, "Evaluation result"), h("dd", null, node.evaluation_result || "—"),
        h("dt", null, "Section reference"), h("dd", null, node.section_reference || "—"),
        h("dt", null, "Payload digest (from export)"), h("dd", null, node.payload_digest || "—"),
        h("dt", null, "Previous hash used"), h("dd", null, node.previousHashUsed || "not available from this export"),
        h("dt", null, "Stated current_hash"), h("dd", null, node.current_hash || "—"),
        node.recomputedHash && h("dt", null, "Recomputed current_hash"),
        node.recomputedHash && h("dd", { className: node.hashMatches ? "match" : "mismatch" }, node.recomputedHash),
        h("div", { className: "kv-note" },
          node.gap
            ? "Sequence gap: this entry's sequence_num does not immediately follow the previous one -- one or more blocks between them are missing from this export."
            : node.previousHashUsed === null
            ? "This is the first entry in the export and its sequence_num is not 0, so its predecessor's current_hash isn't available here to anchor the chain -- linkage from this row backward can't be confirmed offline."
            : node.hashMatches
            ? "Recomputed current_hash matches the value stated in the export -- this block's position, timestamp, and digest are internally consistent with its neighbor."
            : "Recomputed current_hash does NOT match the value stated in the export. Either this row or its stated predecessor hash has been altered since the ledger produced it."
        )
      )
    )
  );
}

function ProofTree({ nodes }) {
  const [expandedSeq, setExpandedSeq] = useState(null);
  const CAP = 400;
  const shown = nodes.slice(0, CAP);
  if (nodes.length === 0) {
    return h("div", { className: "tree-card" }, h("div", { className: "empty-tree" }, "No ledger entries found in this package."));
  }
  return h("div", { className: "tree-card" },
    h("div", { className: "tree-scroll" },
      shown.map((n) => h(ProofNode, { key: n.sequence_num, node: n, expanded: expandedSeq === n.sequence_num, onToggle: () => setExpandedSeq(expandedSeq === n.sequence_num ? null : n.sequence_num) }))
    ),
    nodes.length > CAP && h("div", { className: "callout", style: { margin: "0", borderRadius: 0, borderLeft: "none", borderRight: "none", borderBottom: "none" } },
      `Showing the first ${CAP.toLocaleString()} of ${nodes.length.toLocaleString()} entries. All ${nodes.length.toLocaleString()} were included in the counts above.`)
  );
}

/* =========================================================================
   Root application
   ========================================================================= */
function App() {
  const [sha256, setSha256] = useState(null);
  const [wasmError, setWasmError] = useState(null);
  const [dragActive, setDragActive] = useState(false);
  const [busy, setBusy] = useState(false);
  const [steps, setSteps] = useState([]);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const inputRef = useRef(null);

  useEffect(() => {
    const b64 = document.getElementById("wasm-b64").textContent.trim();
    WasmSha256.create(b64).then(setSha256).catch((e) => setWasmError(String(e)));
  }, []);

  const pushStep = useCallback((label) => setSteps((s) => [...s, label]), []);

  const handleFile = useCallback(async (file) => {
    if (!sha256) return;
    setBusy(true);
    setError(null);
    setResult(null);
    setSteps([]);
    try {
      pushStep(`Reading ${file.name}…`);
      const pkg = await loadPackage(file, sha256);

      let manifestOk = null, manifestFiles = null;
      if (pkg.kind === "zip") {
        pushStep(`Recomputing SHA-256 over ${pkg.manifestFiles.length} manifest file(s)…`);
        manifestFiles = pkg.manifestFiles;
        manifestOk = manifestFiles.every((f) => f.status === "pass");
      }

      let signatureResult = null;
      if (pkg.signature) {
        pushStep("Verifying RSA-PSS digital signature over manifest.json…");
        signatureResult = await verifyManifestSignature(pkg.manifestBytes, pkg.signature);
      }

      let chainNodes = [];
      if (pkg.ledgerEntries) {
        pushStep(`Re-deriving the SHA-256 block hash chain across ${pkg.ledgerEntries.length} ledger entr${pkg.ledgerEntries.length === 1 ? "y" : "ies"}…`);
        chainNodes = verifyLedgerChain(sha256, pkg.ledgerEntries);
      }

      setResult({ pkg, manifestOk, manifestFiles, signatureResult, chainNodes });
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  }, [sha256, pushStep]);

  const onDrop = useCallback((e) => {
    e.preventDefault();
    setDragActive(false);
    if (busy) return;
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleFile(file);
  }, [handleFile, busy]);

  const onBrowsePick = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    if (file) handleFile(file);
    e.target.value = "";
  }, [handleFile]);

  const reset = useCallback(() => { setResult(null); setError(null); setSteps([]); }, []);

  const chainStats = useMemo(() => {
    if (!result) return null;
    const nodes = result.chainNodes;
    const failCount = nodes.filter((n) => n.status === "fail").length;
    const gapCount = nodes.filter((n) => n.status === "warn").length;
    const passCount = nodes.filter((n) => n.status === "pass").length;
    return { total: nodes.length, failCount, gapCount, passCount };
  }, [result]);

  const overallStatus = useMemo(() => {
    if (!result) return null;
    const manifestFail = result.manifestOk === false;
    const signatureFail = result.signatureResult && !result.signatureResult.ok;
    const chainFail = chainStats && chainStats.failCount > 0;
    const chainGap = chainStats && chainStats.gapCount > 0;
    if (manifestFail || signatureFail || chainFail) return "fail";
    if (chainGap) return "warn";
    return "pass";
  }, [result, chainStats]);

  return h("div", { className: "wrap" },
    h("header", { className: "masthead" },
      h(IconChain, { className: "mark" }),
      h("h1", null, "Custody Chain")
    ),
    h("p", { className: "tagline" }, "Independent, offline re-verification of RegEngine AI audit-log packages — every file hash, digital signature, and ledger block re-derived in this browser tab. Nothing you load here is uploaded anywhere."),
    h("div", { className: "meta-row" },
      h("span", null, h("span", { className: "dot" }), sha256 ? "WASM SHA-256 engine ready" : wasmError ? "WASM engine failed to load" : "Loading WASM SHA-256 engine…"),
      h("span", null, h("span", { className: "dot" }), "No network calls during verification"),
      h("span", null, h("span", { className: "dot" }), "Nothing is stored between sessions")
    ),

    h("hr", { className: "rule" }),

    !result && h("div", {
      className: `dropzone ${dragActive ? "active" : ""} ${busy ? "busy" : ""}`,
      onDragOver: (e) => { e.preventDefault(); if (!busy) setDragActive(true); },
      onDragLeave: () => setDragActive(false),
      onDrop,
      onClick: () => !busy && inputRef.current && inputRef.current.click(),
    },
      h("input", { ref: inputRef, type: "file", accept: ".zip,.json", className: "dz-file-input", onChange: onBrowsePick }),
      h(IconUpload, { className: "dz-icon" }),
      h("p", { className: "dz-title" }, busy ? "Verifying…" : "Drop an audit binder here"),
      h("p", { className: "dz-sub" }, busy ? "Recomputing hashes locally — this never leaves your browser." : h(React.Fragment, null, "or ", h("span", { className: "dz-browse" }, "browse your files"))),
      h("p", { className: "dz-formats" }, "regengine_audit_binder_*.zip · ledger_proof.json · audit_binder.json")
    ),

    busy && steps.length > 0 && h("div", { className: "progress-list" },
      steps.map((s, i) => h("div", { className: "progress-row", key: i }, i === steps.length - 1 ? h("span", { className: "spinner" }) : h(IconCheck, { width: 13, height: 13, style: { color: "var(--good)" } }), s))
    ),

    error && h("div", { className: "verdict fail", style: { marginTop: 20 } },
      h("div", { className: "verdict-badge" }, h(IconCross, null)),
      h("div", null, h("p", { className: "verdict-title" }, "Could not verify this package"), h("p", { className: "verdict-sub" }, error))
    ),

    result && h(React.Fragment, null,
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 } },
        h("span", { style: { fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--ink-faint)" } }, result.pkg.fileName),
        h("button", { className: "reset-btn", onClick: reset }, "Verify another package")
      ),

      h("div", { className: `verdict ${overallStatus}`, style: { marginTop: 14 } },
        h("div", { className: "verdict-badge" }, overallStatus === "pass" ? h(IconCheck, null) : overallStatus === "fail" ? h(IconCross, null) : h(IconGap, null)),
        h("div", null,
          h("p", { className: "verdict-title" },
            overallStatus === "pass" ? "Chain intact — no tampering detected" :
            overallStatus === "fail" ? "Tampering detected" :
            "Incomplete — missing block sequence"),
          h("p", { className: "verdict-sub" },
            overallStatus === "pass" ? "Every file hash, signature, and ledger block re-derived in this tab matches the values stated in the package." :
            overallStatus === "fail" ? "One or more re-derived hashes did not match the values stated in the package — see the failing rows below." :
            "The chain that IS present is internally consistent, but one or more sequence numbers are missing from this export.")
        )
      ),

      h("div", { className: "tier-grid" },
        h(TierCard, { name: "Package file integrity", status: result.pkg.kind !== "zip" ? "skip" : result.manifestOk ? "pass" : "fail" },
          result.pkg.kind !== "zip"
            ? h("p", { className: "tier-detail" }, "A bare JSON file has no manifest to check — only its ledger chain (below) was verified.")
            : h(React.Fragment, null,
                h("p", { className: "tier-detail" }, h("span", { className: "tier-num" }, result.manifestFiles.filter((f) => f.status === "pass").length), " / ", h("span", { className: "tier-num" }, result.manifestFiles.length), " files match their manifest hash"),
                result.manifestFiles.some((f) => f.status === "fail") && h("p", { className: "tier-detail" }, result.manifestFiles.filter((f) => f.status === "fail").length, " file(s) altered or missing")
              )
        ),
        h(TierCard, { name: "Digital signature (RSA-PSS)", status: !result.signatureResult ? "skip" : result.signatureResult.ok ? "pass" : "fail" },
          !result.signatureResult
            ? h("p", { className: "tier-detail" }, "No digital_signature.json in this package — signature could not be checked.")
            : h(React.Fragment, null,
                h("p", { className: "tier-detail" }, "Signer: ", h("span", { className: "tier-num" }, result.pkg.signature.signer_id || "unknown")),
                h("p", { className: "tier-detail" }, result.signatureResult.ok ? "Signature verified against the embedded public key." : result.signatureResult.reason)
              )
        ),
        h(TierCard, { name: "Ledger hash chain", status: !chainStats || chainStats.total === 0 ? "skip" : chainStats.failCount > 0 ? "fail" : chainStats.gapCount > 0 ? "warn" : "pass" },
          !chainStats || chainStats.total === 0
            ? h("p", { className: "tier-detail" }, "No ledger entries found in this package.")
            : h(React.Fragment, null,
                h("p", { className: "tier-detail" }, h("span", { className: "tier-num" }, chainStats.passCount), " / ", h("span", { className: "tier-num" }, chainStats.total), " blocks linked correctly"),
                chainStats.failCount > 0 && h("p", { className: "tier-detail" }, h("span", { className: "tier-num" }, chainStats.failCount), " broken link(s)"),
                chainStats.gapCount > 0 && h("p", { className: "tier-detail" }, h("span", { className: "tier-num" }, chainStats.gapCount), " sequence gap(s)")
              )
        )
      ),

      result.pkg.kind === "zip" && h(React.Fragment, null,
        h("div", { className: "section-head" }, h("h2", null, "Package manifest"), h("span", { className: "count" }, result.manifestFiles.length, " file(s)")),
        h("div", { className: "tree-card table-scroll" },
          h("table", { className: "flat-table" },
            h("thead", null, h("tr", null, h("th", null, "Path"), h("th", null, "Status"), h("th", null, "SHA-256"))),
            h("tbody", null, result.manifestFiles.map((f) => h("tr", { key: f.path },
